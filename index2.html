<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Expense Tracker & Smart Itinerary</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-brand-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-white/10 rounded-lg backdrop-blur-sm">
          <i data-lucide="plane-takeoff" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">VoyageSpend</h1>
          <p class="text-xs text-brand-100 font-medium">
            Welcome, <span id="userDisplayName" class="font-bold underline capitalize">User</span>!
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="switchUserBtn" class="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-lg transition">
          Switch User
        </button>
        <button id="resetDataBtn" class="text-xs bg-brand-700 hover:bg-brand-900 px-3 py-2 rounded-lg transition border border-brand-500">
          Clear My Data
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

    <!-- Dynamic Itinerary Section -->
    <section id="itinerarySection" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-4 gap-2">
        <div>
          <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-5 h-5 text-brand-600"></i> Multi-Day Curated Itinerary
          </h2>
          <p id="itinerarySubtitle" class="text-xs text-slate-500 font-medium mt-0.5"></p>
        </div>
        <span id="dailyBudgetBadge" class="bg-brand-50 text-brand-700 border border-brand-200 text-xs font-semibold px-3 py-1 rounded-full"></span>
      </div>

      <!-- Dynamic Cards Grid -->
      <div id="itineraryCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamically Populated -->
      </div>
    </section>

    <!-- Main Expense Tracker Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Form Input -->
      <div class="space-y-6">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-brand-600"></i> Add New Expense
          </h2>
          <form id="expenseForm" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
              <input type="text" id="descInput" required placeholder="e.g. Cab fare, Museum Ticket" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Amount</label>
                <div class="relative">
                  <span class="absolute left-3 top-2 text-slate-400 text-sm">&#8377;</span>
                  <input type="number" step="0.01" min="0.01" id="amountInput" required placeholder="0.00" class="w-full pl-7 pr-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category</label>
                <select id="categoryInput" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm bg-white">
                  <option value="Transport">🚗 Transport</option>
                  <option value="Food">🍽️ Food & Dining</option>
                  <option value="Stay">🏨 Accommodation</option>
                  <option value="Activities">🎟️ Activities</option>
                  <option value="Shopping">🛍️ Shopping</option>
                  <option value="Misc">📦 Miscellaneous</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date</label>
              <input type="date" id="dateInput" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" />
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl font-medium shadow-sm hover:shadow transition flex items-center justify-center gap-2">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Expense
            </button>
          </form>
        </div>
      </div>

      <!-- Right Column: Dashboard & Data List -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Summary Metrics -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Total Spent</span>
            <p id="totalSpentDisplay" class="text-2xl font-black text-brand-600 mt-2">&#8377;0.00</p>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Total Budget</span>
            <p id="totalBudgetDisplay" class="text-2xl font-black text-slate-700 mt-2">&#8377;0.00</p>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Remaining</span>
            <p id="remainingDisplay" class="text-2xl font-black text-emerald-600 mt-2">&#8377;0.00</p>
          </div>
        </div>

        <!-- Budget Utilization Bar -->
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-600 uppercase">Budget Utilization</span>
            <span id="progressPercent" class="text-xs font-bold text-slate-700">0%</span>
          </div>
          <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
            <div id="progressBar" class="bg-brand-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Expense Table -->
        <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h3 class="text-lg font-bold text-slate-800">Transaction History</h3>
            
            <select id="filterCategory" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
              <option value="All">All Categories</option>
              <option value="Transport">Transport</option>
              <option value="Food">Food & Dining</option>
              <option value="Stay">Accommodation</option>
              <option value="Activities">Activities</option>
              <option value="Shopping">Shopping</option>
              <option value="Misc">Miscellaneous</option>
            </select>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400 uppercase">
                  <th class="py-3 px-3">Date</th>
                  <th class="py-3 px-3">Category</th>
                  <th class="py-3 px-3">Description</th>
                  <th class="py-3 px-3 text-right">Amount</th>
                  <th class="py-3 px-3 text-center">Action</th>
                </tr>
              </thead>
              <tbody id="expenseList" class="divide-y divide-slate-50 text-sm">
                <!-- Dynamically Populated -->
              </tbody>
            </table>
            <div id="emptyState" class="py-10 text-center text-slate-400 hidden">
              <i data-lucide="receipt" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
              <p>No expenses recorded yet.</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

    document.addEventListener('DOMContentLoaded', () => {
      const activeUser = localStorage.getItem('active_user');

      if (!activeUser) {
        alert('No active session found. Redirecting to user setup...');
        window.location.href = '/';
        return;
      }

      const userExpensesKey = `expenses_${activeUser}`;
      const userProfileKey = `user_${activeUser}`;

      const rawProfile = localStorage.getItem(userProfileKey);
      const userProfile = rawProfile ? JSON.parse(rawProfile) : null;
      
      let expenses = JSON.parse(localStorage.getItem(userExpensesKey)) || [];
      let budget = userProfile ? (parseFloat(userProfile.budget) || 0) : 0;

      const userDisplayName = document.getElementById('userDisplayName');
      const expenseForm = document.getElementById('expenseForm');
      const descInput = document.getElementById('descInput');
      const amountInput = document.getElementById('amountInput');
      const categoryInput = document.getElementById('categoryInput');
      const dateInput = document.getElementById('dateInput');
      const resetDataBtn = document.getElementById('resetDataBtn');
      const switchUserBtn = document.getElementById('switchUserBtn');
      const filterCategory = document.getElementById('filterCategory');
      const expenseList = document.getElementById('expenseList');
      const emptyState = document.getElementById('emptyState');

      const totalSpentDisplay = document.getElementById('totalSpentDisplay');
      const totalBudgetDisplay = document.getElementById('totalBudgetDisplay');
      const remainingDisplay = document.getElementById('remainingDisplay');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');

      if (userDisplayName) userDisplayName.textContent = activeUser;
      if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];

      // Dynamic Non-Repeating Multi-Day Generator
      function renderItinerary() {
        const itinerarySection = document.getElementById('itinerarySection');
        const itineraryCardsGrid = document.getElementById('itineraryCardsGrid');
        const itinerarySubtitle = document.getElementById('itinerarySubtitle');
        const dailyBudgetBadge = document.getElementById('dailyBudgetBadge');

        if (!userProfile || !userProfile.wantItinerary) {
          itinerarySection.classList.add('hidden');
          return;
        }

        itinerarySection.classList.remove('hidden');

        const city = userProfile.destination || 'Delhi';
        const totalDays = parseInt(userProfile.days) || 3;
        const totalBudget = parseFloat(userProfile.budget) || 0;
        const dailyAllowance = totalDays > 0 ? totalBudget / totalDays : 0;
        const startDateStr = userProfile.startDate || new Date().toISOString().split('T')[0];
        const startDateObj = new Date(startDateStr);

        itinerarySubtitle.textContent = `${totalDays}-Day Visual Itinerary for ${city} (Starting ${startDateStr})`;
        dailyBudgetBadge.textContent = `Target: \u20B9${dailyAllowance.toLocaleString('en-IN', { maximumFractionDigits: 0 })} / day`;

        const cityAttractionPool = CITY_DATABASE[city] || CITY_DATABASE["Delhi"];
        const totalAvailablePlaces = cityAttractionPool.length;

        itineraryCardsGrid.innerHTML = '';

        for (let i = 0; i < totalDays; i++) {
          const currentDayDate = new Date(startDateObj);
          currentDayDate.setDate(startDateObj.getDate() + i);
          const dateFormatted = currentDayDate.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', weekday: 'short' });

          const morningIndex = (i * 3) % totalAvailablePlaces;
          const afternoonIndex = (i * 3 + 1) % totalAvailablePlaces;
          const eveningIndex = (i * 3 + 2) % totalAvailablePlaces;

          const daySlots = [
            { ...cityAttractionPool[morningIndex], time: "Morning" },
            { ...cityAttractionPool[afternoonIndex], time: "Afternoon" },
            { ...cityAttractionPool[eveningIndex], time: "Evening" }
          ];

          const dayCard = document.createElement('div');
          dayCard.className = 'bg-slate-50 border border-slate-200/90 rounded-2xl overflow-hidden shadow-sm flex flex-col justify-between hover:shadow-md transition duration-200';
          
          let activitiesHTML = daySlots.map((act) => {
            const entryText = act.entry === 0 ? "Free Entry" : `Entry: \u20B9${act.entry}`;
            const badgeClass = act.entry === 0 
              ? "bg-emerald-50 text-emerald-700 border-emerald-200" 
              : "bg-blue-50 text-blue-700 border-blue-200";

            return `
              <div class="bg-white p-3.5 rounded-xl border border-slate-100 flex gap-3.5 items-start">
                <img 
                  src="${act.img}" 
                  alt="${act.name}" 
                  onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=500&auto=format&fit=crop'" 
                  class="w-18 h-18 rounded-lg object-cover shrink-0 bg-slate-100" 
                  style="width: 4.5rem; height: 4.5rem;"
                />
                <div class="space-y-1 min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-1 mb-1">
                    <span class="text-[10px] font-bold text-brand-600 uppercase tracking-wider">${act.time}</span>
                    <span class="text-[10px] font-semibold border px-1.5 py-0.5 rounded-full ${badgeClass}">${entryText}</span>
                  </div>
                  <h5 class="text-xs font-bold text-slate-800 leading-snug">${act.name}</h5>
                  <p class="text-[11px] text-slate-500 leading-normal">${act.desc}</p>
                </div>
              </div>
            `;
          }).join('');

          dayCard.innerHTML = `
            <div class="p-4 space-y-4">
              <div class="flex justify-between items-center pb-2 border-b border-slate-200">
                <span class="font-bold text-brand-900 text-sm">Day ${i + 1}</span>
                <span class="text-xs font-semibold text-slate-500 bg-white px-2.5 py-1 rounded-full border border-slate-200">${dateFormatted}</span>
              </div>
              <div class="space-y-3">
                ${activitiesHTML}
              </div>
            </div>
            <div class="px-4 py-3 bg-slate-100/70 border-t border-slate-200/60 flex justify-between items-center text-xs text-slate-600 font-medium">
              <span>Estimated Daily Cap</span>
              <span class="font-bold text-emerald-700">\u20B9${dailyAllowance.toFixed(0)}</span>
            </div>
          `;

          itineraryCardsGrid.appendChild(dayCard);
        }
      }

      const getCategoryBadge = (category) => {
        const badges = {
          Transport: 'bg-blue-50 text-blue-700 border-blue-200',
          Food: 'bg-amber-50 text-amber-700 border-amber-200',
          Stay: 'bg-indigo-50 text-indigo-700 border-indigo-200',
          Activities: 'bg-emerald-50 text-emerald-700 border-emerald-200',
          Shopping: 'bg-purple-50 text-purple-700 border-purple-200',
          Misc: 'bg-slate-50 text-slate-700 border-slate-200'
        };
        return badges[category] || badges.Misc;
      };

      function render() {
        const selectedCategory = filterCategory.value;
        const filteredExpenses = selectedCategory === 'All' 
          ? expenses 
          : expenses.filter(e => e.category === selectedCategory);

        expenseList.innerHTML = '';
        if (filteredExpenses.length === 0) {
          emptyState.classList.remove('hidden');
        } else {
          emptyState.classList.add('hidden');
          filteredExpenses.forEach((exp) => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-50 transition';
            row.innerHTML = `
              <td class="py-3 px-3 text-slate-500 text-xs">${exp.date}</td>
              <td class="py-3 px-3">
                <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold border ${getCategoryBadge(exp.category)}">
                  ${exp.category}
                </span>
              </td>
              <td class="py-3 px-3 font-medium text-slate-800">${exp.desc}</td>
              <td class="py-3 px-3 text-right font-bold text-slate-800">&#8377;${exp.amount.toFixed(2)}</td>
              <td class="py-3 px-3 text-center">
                <button onclick="deleteExpense('${exp.id}')" class="text-slate-400 hover:text-red-500 transition p-1 rounded-lg">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </td>
            `;
            expenseList.appendChild(row);
          });
        }

        const totalSpent = expenses.reduce((acc, curr) => acc + (curr.amount || 0), 0);
        const remaining = budget - totalSpent;
        const rawPercentage = budget > 0 ? (totalSpent / budget) * 100 : 0;
        const displayPercentage = Math.min(rawPercentage, 100);

        totalSpentDisplay.textContent = `\u20B9${totalSpent.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
        totalBudgetDisplay.textContent = `\u20B9${budget.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
        remainingDisplay.textContent = `\u20B9${remaining.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
        
        remainingDisplay.className = remaining < 0 
          ? "text-2xl font-black text-red-600 mt-2" 
          : "text-2xl font-black text-emerald-600 mt-2";

        progressBar.style.width = `${displayPercentage}%`;
        progressPercent.textContent = `${rawPercentage.toFixed(0)}%`;
        
        if (rawPercentage >= 100) {
          progressBar.className = "bg-red-500 h-3 rounded-full transition-all duration-300";
        } else if (rawPercentage >= 80) {
          progressBar.className = "bg-amber-500 h-3 rounded-full transition-all duration-300";
        } else {
          progressBar.className = "bg-brand-600 h-3 rounded-full transition-all duration-300";
        }

        if (window.lucide) {
          lucide.createIcons();
        }
      }

      function saveState() {
        localStorage.setItem(userExpensesKey, JSON.stringify(expenses));
        render();
      }

      expenseForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const parsedAmount = parseFloat(amountInput.value);
        if (isNaN(parsedAmount) || parsedAmount <= 0) return;

        const newExpense = {
          id: Date.now().toString(),
          desc: descInput.value.trim(),
          amount: parsedAmount,
          category: categoryInput.value,
          date: dateInput.value
        };

        expenses.unshift(newExpense);
        saveState();

        descInput.value = '';
        amountInput.value = '';
        descInput.focus();
      });

      window.deleteExpense = function(id) {
        expenses = expenses.filter(exp => exp.id !== id);
        saveState();
      };

      filterCategory.addEventListener('change', render);

      resetDataBtn.addEventListener('click', () => {
        if (confirm(`Are you sure you want to clear all data for user "${activeUser}"?`)) {
          expenses = [];
          localStorage.removeItem(userExpensesKey);
          render();
        }
      });

      switchUserBtn.addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.href = '/';
      });

      renderItinerary();
      render();
    });
  </script>
</body>
</html>
