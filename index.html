<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker Setup</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React-DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#b2ede8] via-[#8ae3db] to-[#60d6cb] text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script>
    const { useState, useEffect, createElement: h } = React;

    function ExpenseTrackerSetup() {
      const [formData, setFormData] = useState({
        username: '',
        mobile: '',
        members: 1,
        destination: '',
        budget: '',
        dateFrom: '',
        dateTo: '',
        wantItinerary: true
      });

      useEffect(() => {
        const activeUser = localStorage.getItem('active_user');
        if (activeUser) {
          loadUserPreferences(activeUser);
        }
      }, []);

      const loadUserPreferences = (name) => {
        if (!name) return;
        const savedData = localStorage.getItem(`user_${name}`);
        if (savedData) {
          try {
            const profile = JSON.parse(savedData);
            setFormData({
              username: name,
              mobile: profile.mobile || '',
              members: profile.members || 1,
              destination: profile.destination || '',
              budget: profile.budget || '',
              dateFrom: profile.startDate || '',
              dateTo: profile.endDate || '',
              wantItinerary: profile.wantItinerary !== undefined ? profile.wantItinerary : true
            });
          } catch (e) {
            console.error("Error parsing profile", e);
          }
        }
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData((prev) => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));

        if (name === 'username') {
          loadUserPreferences(value.trim());
        }
      };

      const toggleItinerary = () => {
        setFormData(prev => ({ ...prev, wantItinerary: !prev.wantItinerary }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const username = formData.username.trim();
        const budgetNum = parseFloat(formData.budget) || 0;
        const membersNum = parseInt(formData.members) || 1;

        let days = 1;
        if (formData.dateFrom && formData.dateTo) {
          const start = new Date(formData.dateFrom);
          const end = new Date(formData.dateTo);
          if (end >= start) {
            const diffTime = Math.abs(end - start);
            days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
          }
        }

        const userProfile = {
          name: username,
          mobile: formData.mobile.trim(),
          destination: formData.destination,
          budget: budgetNum,
          members: membersNum,
          days: days,
          startDate: formData.dateFrom,
          endDate: formData.dateTo,
          wantItinerary: formData.wantItinerary
        };

        localStorage.setItem(`user_${username}`, JSON.stringify(userProfile));
        localStorage.setItem('active_user', username);
        
        localStorage.setItem('travel_budget', budgetNum);
        localStorage.setItem('travel_destination', formData.destination);
        localStorage.setItem('travel_members', membersNum);
        localStorage.setItem('travel_days', days);
        localStorage.setItem('want_itinerary', formData.wantItinerary ? 'yes' : 'no');

        window.location.href = './index2.html';
      };

      return h('div', { className: 'min-h-screen flex flex-col justify-between pb-12' },
        // Header Navigation
        h('header', { className: 'w-full px-12 py-6 flex justify-between items-center text-[#1a2b3c]' },
          h('h1', { className: 'text-lg font-black tracking-widest uppercase' }, 'EXPENSE TRACKER'),
          h('nav', { className: 'flex space-x-8 text-xs font-bold tracking-widest uppercase' },
            h('a', { href: '#home', className: 'hover:opacity-75 transition' }, 'HOME'),
            h('a', { href: '#contact', className: 'hover:opacity-75 transition' }, 'CONTACT US')
          )
        ),

        // Main Form Card Container
        h('main', { className: 'max-w-2xl w-full mx-auto px-4 mt-2 mb-8' },
          h('div', { className: 'bg-[#e9f8f7]/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 sm:p-10 border border-white/50 text-center' },
            
            // Card Title Section
            h('div', { className: 'mb-8' },
              h('p', { className: 'text-[11px] font-bold tracking-widest text-[#3d5a5b] uppercase mb-2' }, 'PLAN YOUR JOURNEY'),
              h('h2', { className: 'text-2xl font-bold text-[#1f3031] tracking-tight mb-2' }, 'Expense Tracker'),
              h('p', { className: 'text-xs font-medium text-[#4a6b6c]' }, 'Plan your trip and manage your travel expenses with ease.')
            ),

            // Form
            h('form', { onSubmit: handleSubmit, className: 'space-y-6 text-left max-w-xl mx-auto' },
              
              // Username
              h('div', null,
                h('label', { className: 'block text-center text-[11px] font-bold uppercase tracking-wider text-[#2e4748] mb-2' }, 'USERNAME'),
                h('input', {
                  type: 'text',
                  name: 'username',
                  required: true,
                  value: formData.username,
                  onChange: handleChange,
                  className: 'w-full px-5 py-3 rounded-2xl border border-[#c1ebe6] focus:border-[#42c5b8] focus:ring-0 outline-none text-sm text-[#2c3e50] bg-white transition shadow-sm'
                })
              ),

              // Mobile Number
              h('div', null,
                h('label', { className: 'block text-center text-[11px] font-bold uppercase tracking-wider text-[#2e4748] mb-2' }, 'MOBILE NUMBER'),
                h('input', {
                  type: 'text',
                  name: 'mobile',
                  value: formData.mobile,
                  onChange: handleChange,
                  className: 'w-full px-5 py-3 rounded-2xl border border-[#c1ebe6] focus:border-[#42c5b8] focus:ring-0 outline-none text-sm text-[#2c3e50] bg-white transition shadow-sm'
                })
              ),

              // Members & Destination Row
              h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4' },
                h('div', null,
                  h('label', { className: 'block text-center text-[11px] font-bold uppercase tracking-wider text-[#2e4748] mb-2' }, 'NUMBER OF MEMBERS'),
                  h('input', {
                    type: 'number',
                    name: 'members',
                    min: '1',
                    required: true,
                    value: formData.members,
                    onChange: handleChange,
                    className: 'w-full px-5 py-3 rounded-2xl border border-[#c1ebe6] focus:border-[#42c5b8] focus:ring-0 outline-none text-sm text-[#2c3e50] bg-white transition shadow-sm'
                  })
                ),
                h('div', null,
                  h('label', { className: 'block text-center text-[11px] font-bold uppercase tracking-wider text-[#2e4748] mb-2' }, 'DESTINATION'),
                  h('select', {
                    name: 'destination',
                    required: true,
                    value: formData.destination,
                    onChange: handleChange,
                    className: 'w-full px-5 py-3 rounded-2xl border border-[#c1ebe6] focus:border-[#42c5b8] focus:ring-0 outline-none text-sm text-[#2c3e50] bg-white transition shadow-sm appearance-none'
                  },
                    h('option', { value: '', disabled: true }, 'Select Destination'),
                    ['Mumbai', 'Delhi', 'Bengaluru', 'Kolkata', 'Chennai', 'Hyderabad', 'Ahmedabad', 'Pune'].map(city =>
                      h('option', { key: city, value: city }, city)
                    )
                  )
                )
              ),

              // Budget of Trip
              h('div', null,
                h('label', { className: 'block text-center text-[11px] font-bold uppercase tracking-wider text-[#2e4748] mb-2' }, 'BUDGET OF TRIP (₹)'),
                h('div', { className: 'relative' },
                  h('span', { className: 'absolute left-5 top-1/2 -translate-y-1/2 text-sm text-[#506e70] font-medium' }, '₹'),
                  h('input', {
                    type: 'number',
                    name: 'budget',
                    step: '0.01',
                    min: '0',
                    required: true,
                    value: formData.budget,
                    onChange: handleChange,
                    className: 'w-full pl-10 pr-5 py-3 rounded-2xl border-2 border-[#54d2c5] focus:outline-none text-sm text-[#2c3e50] bg-white transition shadow-sm'
                  })
                )
              ),

              // Date Range Row (From & To)
              h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4' },
                h('div', null,
                  h('label', { className: 'block text-center text-[11px] font-bold uppercase tracking-wider text-[#2e4748] mb-2' }, 'FROM'),
                  h('input', {
                    type: 'date',
                    name: 'dateFrom',
                    required: true,
                    value: formData.dateFrom,
                    onChange: handleChange,
                    className: 'w-full px-5 py-3 rounded-2xl border border-[#c1ebe6] focus:border-[#42c5b8] focus:ring-0 outline-none text-sm text-[#2c3e50] bg-white transition shadow-sm text-center'
                  })
                ),
                h('div', null,
                  h('label', { className: 'block text-center text-[11px] font-bold uppercase tracking-wider text-[#2e4748] mb-2' }, 'TO'),
                  h('input', {
                    type: 'date',
                    name: 'dateTo',
                    required: true,
                    value: formData.dateTo,
                    onChange: handleChange,
                    className: 'w-full px-5 py-3 rounded-2xl border border-[#c1ebe6] focus:border-[#42c5b8] focus:ring-0 outline-none text-sm text-[#2c3e50] bg-white transition shadow-sm text-center'
                  })
                )
              ),

              // Travel Itinerary Toggle Box
              h('div', { className: 'bg-[#d5f3f0] p-4 rounded-2xl flex items-center justify-between mt-4' },
                h('div', null,
                  h('p', { className: 'text-[11px] font-bold uppercase tracking-wider text-[#213a3b]' }, 'DO YOU ALSO WANT TRAVEL ITINERARY?'),
                  h('p', { className: 'text-[11px] text-[#4b7677] font-medium mt-0.5' }, formData.wantItinerary ? 'Yes' : 'No')
                ),
                h('button', {
                  type: 'button',
                  onClick: toggleItinerary,
                  className: `w-12 h-6 flex items-center rounded-full p-1 cursor-pointer transition-colors duration-300 ${formData.wantItinerary ? 'bg-[#3ebcb0]' : 'bg-slate-300'}`
                },
                  h('div', {
                    className: `bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-300 ${formData.wantItinerary ? 'translate-x-6' : 'translate-x-0'}`
                  })
                )
              ),

              // Submit Button
              h('button', {
                type: 'submit',
                className: 'w-full mt-6 bg-[#1a2332] hover:bg-[#111827] text-white font-semibold py-3.5 rounded-2xl transition duration-200 shadow-md flex items-center justify-center gap-2 text-sm'
              },
                h('span', null, 'Submit'),
                h('svg', { className: 'w-4 h-4', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                  h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M14 5l7 7m0 0l-7 7m7-7H3' })
                )
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(ExpenseTrackerSetup));
  </script>
</body>
</html>
